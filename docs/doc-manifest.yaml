# Documentation quality-gate manifest (issue #377).
#
# Records every MECHANICALLY CHECKED documentation example and its
# verification mode, plus page-level link/command checks. See
# docs/agents/doc-quality.md for the policy and the contributor
# workflow for adding a checked example. Run with:
#   just ci-docs-assert
#
# Schema:
#   version : 1
#   pages   : list of {page, checks, examples}
#     page     : repo-relative path to a doc page (.md/.mdx).
#     checks   : page-level mechanical checks applied to EVERY
#                matching fence on the page:
#                  commands - every sh/bash fence: `just <recipe>`,
#                             `./scripts/<x>`, and repo-relative paths
#                             (first component a known top-level dir)
#                             must resolve. Illustrative placeholders
#                             like src/main.qn are not flagged.
#                  links    - every internal markdown link and every
#                             github.com/arniber21/quon/blob/<ref>/<path>
#                             must resolve to a checked-in page or
#                             section directory.
#     examples : per-fence records. A fence NOT listed here is
#                `illustrative` by default (recorded but not
#                mechanically verified — see the policy). Each entry:
#                  lang     : fence info-string (qn, kotlin, mlir,
#                             json, markdown, text, ...).
#                  ordinal  : 1-based index among fences with that lang.
#                  mode     : executable | generated | stale
#                  verify   : mirror (for executable) — the fence's
#                             code, with -- comments stripped and
#                             whitespace collapsed, must be a substring
#                             of `source` (or each blank-line-separated
#                             chunk must be — tolerating elision).
#                  source   : canonical tested fixture (compiled/lowered
#                             by `just ci-rust`) the excerpt mirrors.
#                  regen    : for generated — the command/recipe that
#                             regenerates the excerpt (must name a known
#                             just recipe, ./scripts/ file, or allowed bin).
#                  reason   : for stale — why intentionally-historical
#                             material is kept.
#
# Modes (the four-way policy distinction, issue #377):
#   executable - real Quon that compiles; drift-checked against a tested
#               fixture (the source-compatibility discipline from #377).
#   generated  - tool output (MLIR/QASM/JSON reports); must declare a
#               regenerator. Byte-fidelity is not asserted for excerpts
#               with elisions; a `golden` may name a checked-in artifact.
#   stale      - intentionally-retained historical material; requires a
#               reason so stale prose is explicit, not accidental.
#   illustrative (default) - hand-written pseudocode, schematic IR, or
#               pedagogical fragments not claimed to compile.
version: 1
pages:
