name: Flux

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "flux_verify/**"
      - "quon_core/**"
      - "backend/**"
      - "quon_qec/**"
      - "quon_na/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/flux.yml"

permissions:
  contents: read

jobs:
  flux:
    name: refinement types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install z3
        # `z3` provides the solver binary that liquid-fixpoint spawns at
        # runtime; `libz3-dev` alone is not enough.
        run: sudo apt-get update && sudo apt-get install -y z3 libz3-dev

      - name: Install Flux (pinned toolchain)
        # Pin the Flux toolchain to an exact, reviewed commit so refinement
        # checks are deterministic and any internal compiler error is
        # reproducible (issue #404). `flux --version` reports the short SHA;
        # the full 40-char hash below is what `git fetch` resolves.
        # Bump this pin deliberately — never go back to an unreviewed moving
        # `--depth 1` clone of `main`.
        run: |
          set -euo pipefail
          BIN="$HOME/.cargo/bin"
          mkdir -p "$BIN"
          curl -fsSL "https://github.com/ucsd-progsys/liquid-fixpoint/releases/download/nightly/fixpoint-x86_64-linux-gnu.tar.gz" | tar xz -C "$BIN"
          chmod +x "$BIN/fixpoint"
          git clone --depth 1 https://github.com/flux-rs/flux /tmp/flux
          cd /tmp/flux && git fetch --depth 1 origin 57773e946c619199a733350023164eaeca49e1a0 && git checkout 57773e946c619199a733350023164eaeca49e1a0
          (cd /tmp/flux && cargo xtask install)

      # `flux_verify` transitively pulls `quon_na` (and therefore `quon_qec`)
      # as *dependencies*. Flux verifies every `enabled = true` crate in the
      # build graph, so these are checked without their `flux` cargo feature —
      # which leaves their `#[cfg_attr(feature = "flux", flux_rs::trusted)]`
      # attrs inactive and trips the flux-infer internal compiler errors
      # documented in `docs/adr/0027-flux-infer-iterator-closure-ice.md`.
      # `continue-on-error` keeps the failure visible (reproducible on the
      # pinned toolchain) without gating the rest of the workflow. Remove once
      # upstream flux-infer stops panicking on closure-based iterator adapters.
      - name: cargo flux (flux_verify)
        continue-on-error: true
        run: cargo flux -p flux_verify

      - name: cargo flux (quon_core)
        run: cargo flux -p quon_core --features flux

      - name: cargo flux (backend)
        run: cargo flux -p backend --features flux

      - name: cargo flux (quon_qec)
        run: cargo flux -p quon_qec --features flux

      # `quon_na` still hits the flux-infer ICEs tracked in ADR-0027
      # (`projections.rs` / `infer.rs` "impossible case reached") on several
      # iterator-closure-heavy functions. `continue-on-error` keeps the run
      # visible and reproducible on the pinned toolchain while upstream is
      # fixed. The five `#[trusted]` workarounds already applied in
      # `quon_na/src/compaction.rs` clear the attributable out-of-bounds
      # refinement errors; the remaining failures are pure toolchain ICEs.
      - name: cargo flux (quon_na)
        continue-on-error: true
        # `--no-default-features` avoids pulling the `mlir` feature (nightly +
        # MLIR libs) into the Flux check; `flux` is the intended feature set
        # (see `quon_na/Cargo.toml`).
        run: cargo flux -p quon_na --no-default-features --features flux
