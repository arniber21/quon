name: Taskless

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ast-grep rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Taskless check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            if [ -z "$FILES" ]; then
              echo "No changed files."
              exit 0
            fi
            # Pinned to the schema 3 install in .taskless/taskless.json.
            # @latest (0.11+) expects schema 7 and refuses to check.
            npx @taskless/cli@0.9.0 check $FILES
          else
            npx @taskless/cli@0.9.0 check
          fi
