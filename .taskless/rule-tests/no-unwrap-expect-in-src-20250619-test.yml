id: no-unwrap-expect-in-src
valid:
  - |
    fn parse(s: &str) -> Result<i32, String> {
        s.parse().map_err(|e| e.to_string())
    }
  - |
    fn ok() -> Option<i32> {
        Some(1)
    }
  - |
    fn prod() -> i32 {
        let v: Result<i32, ()> = Ok(1);
        v.unwrap_or(2)
    }
  - |
    #[cfg(test)]
    mod tests {
        use super::*;
        fn helper() -> i32 {
            "42".parse().unwrap()
        }
        #[test]
        fn it_works() {
            "42".parse().expect("must parse");
        }
    }
  - |
    #[cfg(all(test, feature = "mlir"))]
    mod tests {
        fn helper() -> i32 {
            "42".parse().unwrap()
        }
    }
invalid:
  - |
    fn bad() -> i32 {
        "42".parse().unwrap()
    }
  - |
    fn worse() -> i32 {
        "42".parse().expect("must parse")
    }
  - |
    struct S;
    impl S {
        fn boom(&self) -> i32 {
            "42".parse().unwrap()
        }
    }
