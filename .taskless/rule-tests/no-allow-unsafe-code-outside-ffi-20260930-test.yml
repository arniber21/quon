id: no-allow-unsafe-code-outside-ffi
valid:
  - |
    fn safe() -> i32 {
        1
    }
  - |
    #[allow(dead_code)]
    fn unused() -> i32 {
        1
    }
  - |
    #![deny(unsafe_code)]
    fn denied() -> i32 {
        1
    }
invalid:
  - |
    #[allow(unsafe_code)]
    fn pierce() {
        unsafe { std::env::set_var("X", "1") }
    }
  - |
    #![allow(unsafe_code)]
    fn inner() -> i32 {
        1
    }
  - |
    #[allow(dead_code, unsafe_code)]
    fn listed() -> i32 {
        1
    }
  - |
    #[allow(
        unsafe_code
    )]
    fn wrapped() -> i32 {
        1
    }
