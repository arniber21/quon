[package]
name = "mlir_bridge-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Detached from the main workspace: fuzzing needs nightly + libfuzzer, which the
# stable workspace build must not pull in. Building still requires LLVM 22 / MLIR
# because the targets link `mlir_bridge` (set MLIR_SYS_220_PREFIX); the fuzzed
# code path itself — DepthExpr S-expression parsing — is pure Rust, pulling
# `DepthExpr` directly from `quon_core` (#410).
[workspace]
members = ["."]

# Same _FORTIFY_SOURCE / -O0 fix as the main workspace Cargo.toml: Nix's gcc
# injects -D_FORTIFY_SOURCE, and glibc emits a fatal -Werror warning at -O0,
# which tblgen's -Werror turns fatal.
[profile.dev.build-override]
opt-level = 1

[profile.release.build-override]
opt-level = 1

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.mlir_bridge]
path = ".."

[dependencies.quon_core]
path = "../../quon_core"

[[bin]]
name = "fuzz_depth_parse"
path = "fuzz_targets/fuzz_depth_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_depth_roundtrip"
path = "fuzz_targets/fuzz_depth_roundtrip.rs"
test = false
doc = false
bench = false
